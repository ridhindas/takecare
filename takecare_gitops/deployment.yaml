   apiVersion: apps/v1
   kind: Deployment
   metadata:
     name: takecare-app
   spec:
     replicas: 1
     selector:
       matchLabels:
         app: takecare
     template:
       metadata:
         labels:
           app: takecare
       spec:
         containers:
         - name: takecare
           image: ridhindas/takecare-app:17
           ports:
           - containerPort: 8000
